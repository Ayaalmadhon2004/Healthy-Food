<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">NutriFlow</title>
  <desc id="d">NutriFlow: eating well in Gaza, with what you have.</desc>
  <style>
    .sans { font-family: Poppins, Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .steam { fill: none; stroke: #b5613c; stroke-width: 5; stroke-linecap: round; opacity: 0; animation: rise 4.5s ease-in-out infinite; }
    .s2 { animation-delay: 1.4s; }
    .s3 { animation-delay: 2.8s; }
    .leaf { transform-box: fill-box; transform-origin: 0% 100%; animation: sway 6s ease-in-out infinite; }
    .float { animation: bob 7s ease-in-out infinite; }
    .dot { animation: twinkle 5s ease-in-out infinite; }
    @keyframes rise {
      0% { opacity: 0; transform: translateY(14px); }
      30% { opacity: .7; }
      100% { opacity: 0; transform: translateY(-16px); }
    }
    @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="320" rx="16" fill="#f6f0e3"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="15.5" fill="none" stroke="#ddd2bd"/>
  <circle cx="190" cy="160" r="118" fill="#ede4d1"/>

  <!-- bowl + leaves (the app's logo mark, enlarged) -->
  <g transform="translate(70 40) scale(5)"><g class="float">
    <path d="M6.5 22.5c.4 9.6 7.2 17 17.6 17 10.2 0 17.1-7.4 17.6-17.2-11.7.5-23.6.4-35.2.2Z" fill="#4d5a2c"/>
    <path d="M5 22.4c11.8.3 25.6.5 38.1-.1" stroke="#2b261f" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M24.3 21.5c-.4-5.2.3-9.4 2.6-13.4" stroke="#2b261f" stroke-width="2.2" stroke-linecap="round"/>
    <g class="leaf"><path d="M26.6 9.2c4.6-.9 8.2.4 10.1 3.1-3.9 2.3-7.9 1.9-10.1-3.1Z" fill="#b5613c"/></g>
    <g class="leaf" style="animation-delay:-2s"><path d="M24.6 15.6c-3.6-2.2-7.3-2.1-10-.2 1.7 3.7 6 4.4 10 .2Z" fill="#8a9654"/></g>
  </g></g>

  <!-- words -->
  <text class="sans" x="360" y="150" font-size="84" font-weight="600" fill="#2b261f">Nutri<tspan fill="#6f7e44">Flow</tspan></text>
  <text class="sans" x="362" y="198" font-size="26" fill="#5b5446">Eating well in Gaza, with what you have.</text>
  <text class="sans" x="362" y="240" font-size="17" letter-spacing="2" fill="#934b2f">MEALS  ·  RECIPES  ·  DOCTORS  ·  ARABIC &amp; ENGLISH</text>

  <!-- the same dotted band the site uses -->
  <g>
    <line x1="40" y1="288" x2="1160" y2="288" stroke="#ddd2bd" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round"/>
    <g class="dot" fill="#b5613c"><rect x="170" y="284" width="8" height="8" transform="rotate(45 174 288)"/><rect x="530" y="284" width="8" height="8" transform="rotate(45 534 288)"/><rect x="890" y="284" width="8" height="8" transform="rotate(45 894 288)"/></g>
    <g class="dot" fill="#4d5a2c" style="animation-delay:-2.5s"><rect x="350" y="284" width="8" height="8" transform="rotate(45 354 288)"/><rect x="710" y="284" width="8" height="8" transform="rotate(45 714 288)"/><rect x="1070" y="284" width="8" height="8" transform="rotate(45 1074 288)"/></g>
  </g>
</svg>
